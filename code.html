<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Долг Казино: Мега Турбо</title>
<style>
    body { margin: 0; overflow: hidden; background: #111; color: white; font-family: 'Segoe UI', sans-serif; user-select: none; }
    #ui { position: absolute; inset: 0; pointer-events: none; z-index: 10; }
    
    .hud { position: absolute; top: 20px; left: 20px; background: rgba(0,0,0,0.7); padding: 10px 20px; border-radius: 30px; font-weight: bold; display: none; font-size: 20px; border: 1px solid rgba(255,255,255,0.2); }
    .hud span { color: #ffcc00; }
    
    .debt-bar { position: absolute; top: 20px; left: 50%; transform: translateX(-50%); width: 300px; height: 25px; background: rgba(0,0,0,0.7); border-radius: 20px; border: 2px solid #ff3333; display: none; overflow: hidden; }
    .debt-fill { height: 100%; width: 0%; background: #ff3333; transition: width 0.3s; }
    .debt-text { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); font-size: 14px; font-weight: bold; text-shadow: 1px 1px 2px #000; }
    
    .speedometer { position: absolute; bottom: 30px; right: 30px; background: rgba(0,0,0,0.7); padding: 15px; border-radius: 20px; font-weight: bold; font-size: 24px; display: none; border: 2px solid #ffcc00; text-align: center; width: 120px; }
    .menu-btn-game { position: absolute; top: 20px; right: 30px; width: 60px; height: 60px; background: rgba(0,0,0,0.7); border: 1px solid rgba(255,255,255,0.3); border-radius: 50%; display: none; align-items: center; justify-content: center; font-size: 28px; pointer-events: auto; cursor: pointer; }
    
    /* ДЖОЙСТИК */
    .joystick-container { position: absolute; bottom: 30px; left: 30px; width: 160px; height: 160px; background: rgba(255,255,255,0.1); border-radius: 50%; border: 3px solid rgba(255,255,255,0.3); pointer-events: auto; touch-action: none; display: none; box-shadow: 0 0 20px rgba(0,0,0,0.5); }
    .joystick-knob { position: absolute; top: 50%; left: 50%; width: 70px; height: 70px; background: rgba(255,255,255,0.8); border-radius: 50%; transform: translate(-50%, -50%); pointer-events: none; box-shadow: 0 0 15px rgba(255,255,255,0.4); }

    .overlay { position: absolute; inset: 0; background: rgba(0,0,0,0.85); display: flex; flex-direction: column; align-items: center; justify-content: center; pointer-events: auto; z-index: 100; }
    .overlay.hidden { display: none !important; }
    .menu-panel { background: #222; border: 1px solid #444; border-radius: 28px; padding: 30px; width: 90%; max-width: 600px; text-align: center; max-height: 90vh; overflow-y: auto; }
    h1 { margin: 0 0 10px; font-weight: 300; color: #ffcc00; letter-spacing: 2px; }
    .coins { font-size: 22px; margin: 10px 0; color: #ff3333; font-weight: bold; }
    
    button { background: #333; border: 1px solid #555; color: white; padding: 14px 28px; border-radius: 40px; font-size: 17px; cursor: pointer; margin: 5px; transition: 0.2s; }
    button:hover { background: #444; }
    button.primary { background: #ffcc00; color: #000; font-weight: bold; border-color: #ffcc00; }
    
    .location-grid { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 10px; margin: 20px 0; }
    .shop-item { display: flex; justify-content: space-between; align-items: center; padding: 10px 0; border-bottom: 1px solid #333; font-size: 15px; }
    .shop-item button { padding: 8px 15px; font-size: 14px; }
</style>
</head>
<body>
<div id="ui">
    <div class="hud" id="hud">Круг: <span id="lapDisplay">1/3</span></div>
    <div class="debt-bar" id="debtBar">
        <div class="debt-fill" id="debtFill"></div>
        <div class="debt-text" id="debtText">Долг: 10000 💰</div>
    </div>
    <div class="speedometer" id="speedo">0 <div style="font-size:12px;color:#aaa;">км/ч</div></div>
    <div class="menu-btn-game" id="menuBtnGame">☰</div>

    <!-- ДЖОЙСТИК -->
    <div class="joystick-container" id="joystick">
        <div class="joystick-knob" id="joystickKnob"></div>
    </div>

    <div class="overlay" id="menuOverlay">
        <div class="menu-panel">
            <h1>ДОЛГ КАЗИНО</h1>
            <p style="color:#aaa; font-size:14px;">Вы проиграли 10 000 монет. Верните долг!</p>
            <div class="coins" id="coinsDisplay">Долг: 10000 💰</div>
            <div class="location-grid">
                <button class="primary" id="btnTrack">Трасса</button>
                <button class="primary" id="btnDesert">Пустыня</button>
                <button class="primary" id="btnSnow">Снег</button>
                <button class="primary" id="btnCity">Город</button>
                <button class="primary" id="btnLava">Лава</button>
                <button class="primary" id="btnSpace">Космос</button>
            </div>
            <button id="shopBtn">Магазин / Тюнинг</button>
            <p style="font-size:12px;color:#aaa; margin-top:15px;">Управление: WASD / Стрелки / Джойстик</p>
        </div>
    </div>

    <div class="overlay hidden" id="resultsOverlay">
        <div class="menu-panel">
            <h1 id="resultsTitle">ФИНИШ</h1>
            <div id="resultsBody" style="margin: 20px 0; font-size: 18px;"></div>
            <div id="rewardDisplay" style="font-size:22px;margin:15px 0;color:#ffcc00;"></div>
            <button class="primary" id="resultsMenuBtn">В меню</button>
        </div>
    </div>

    <div class="overlay hidden" id="shopOverlay">
        <div class="menu-panel">
            <h1>МАГАЗИН</h1>
            <div class="coins" id="shopCoinsDisplay">💰 0</div>
            <div id="colorPicker" style="display:flex; gap:8px; justify-content:center; margin-bottom:15px; flex-wrap:wrap;"></div>
            
            <div class="shop-item"><span>Спойлер</span><button id="buySpoiler">50 💰</button></div>
            <div class="shop-item"><span>Неон</span><button id="buyNeon">100 💰</button></div>
            <div class="shop-item"><span>Золотые диски</span><button id="buyGold">150 💰</button></div>
            <div class="shop-item"><span>Крылья</span><button id="buyWings">200 💰</button></div>
            <div class="shop-item"><span>Антенна</span><button id="buyAntenna">80 💰</button></div>
            <div class="shop-item"><span>Тонировка</span><button id="buyTint">120 💰</button></div>
            <div class="shop-item"><span>Радужный выхлоп</span><button id="buyRainbow">90 💰</button></div>
            <div class="shop-item"><span>Мигалка</span><button id="buyPolice">140 💰</button></div>
            <div class="shop-item"><span>Клыки</span><button id="buyHorns">110 💰</button></div>
            <div class="shop-item"><span>Купол</span><button id="buyBubble">160 💰</button></div>
            <button style="margin-top:20px;" id="shopBackBtn">Назад</button>
        </div>
    </div>
</div>

<script src="three.min.js"></script>
<script>
// Глобальные переменные
let scene, camera, renderer;
let state = { coins: 0, debt: 10000, carColor: 0xff3333, parts: { spoiler: false, neon: false, gold: false, wings: false, antenna: false, tint: false, rainbow: false, police: false, horns: false, bubble: false }, raceActive: false, gameBeaten: false };
let player = { mesh: null, angle: 0, speed: 0, lap: 1, nextCp: 0, neonLight: null, policeLight: null };
let bot = { mesh: null, angle: 0, nextCp: 0 };
let cps = [], trackObjects = [], keys = {};
let dustParticles = [];
let audioCtx, engineOsc, engineGain;

// Переменные джойстика
let joystick = { x: 0, y: 0, active: false };

window.onload = function() {
    if (typeof THREE === 'undefined') { 
        document.body.innerHTML = '<h1 style="color:red;text-align:center;margin-top:50px;">Ошибка: three.min.js не найден!</h1>'; 
        return; 
    }

    scene = new THREE.Scene();
    camera = new THREE.PerspectiveCamera(65, window.innerWidth / window.innerHeight, 0.1, 1000);
    renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;
    document.body.appendChild(renderer.domElement);

    scene.add(new THREE.AmbientLight(0xffffff, 0.6));
    const dirLight = new THREE.DirectionalLight(0xffffff, 1.2);
    dirLight.position.set(30, 60, 30); 
    dirLight.castShadow = true;
    dirLight.shadow.mapSize.width = 2048; 
    dirLight.shadow.mapSize.height = 2048;
    dirLight.shadow.camera.left = -150; 
    dirLight.shadow.camera.right = 150; 
    dirLight.shadow.camera.top = 150; 
    dirLight.shadow.camera.bottom = -150;
    scene.add(dirLight);

    window.addEventListener('resize', () => {
        camera.aspect = window.innerWidth / window.innerHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(window.innerWidth, window.innerHeight);
    });

    audioCtx = new (window.AudioContext || window.webkitAudioContext)();

    // Инициализация джойстика
    const joyEl = document.getElementById('joystick'), knob = document.getElementById('joystickKnob');
    let joyId = null, joyCenter = {x:0, y:0};
    
    joyEl.addEventListener('pointerdown', e => { 
        joyId = e.pointerId; 
        const r = joyEl.getBoundingClientRect(); 
        joyCenter = { x: r.left + r.width/2, y: r.top + r.height/2 }; 
        joyEl.setPointerCapture(joyId); 
        updateJoy(e); 
    });
    joyEl.addEventListener('pointermove', e => { if (joyId === e.pointerId) updateJoy(e); });
    joyEl.addEventListener('pointerup', e => { 
        if (joyId === e.pointerId) { 
            joyId = null; 
            joystick = {x:0, y:0, active: false}; 
            knob.style.transform = `translate(-50%, -50%)`; 
        } 
    });
    
    function updateJoy(e) {
        const dx = e.clientX - joyCenter.x, dy = e.clientY - joyCenter.y;
        const dist = Math.min(Math.sqrt(dx*dx + dy*dy), 50);
        const ang = Math.atan2(dy, dx);
        const kx = Math.cos(ang) * dist, ky = Math.sin(ang) * dist;
        knob.style.transform = `translate(calc(-50% + ${kx}px), calc(-50% + ${ky}px))`;
        joystick = { x: Math.cos(ang)*dist/50, y: Math.sin(ang)*dist/50, active: true };
    }

    // Привязка кнопок меню
    document.getElementById('btnTrack').onclick = () => window.startRace('track');
    document.getElementById('btnDesert').onclick = () => window.startRace('desert');
    document.getElementById('btnSnow').onclick = () => window.startRace('snow');
    document.getElementById('btnCity').onclick = () => window.startRace('city');
    document.getElementById('btnLava').onclick = () => window.startRace('lava');
    document.getElementById('btnSpace').onclick = () => window.startRace('space');

    document.getElementById('shopBtn').onclick = () => { document.getElementById('menuOverlay').classList.add('hidden'); document.getElementById('shopOverlay').classList.remove('hidden'); renderShop(); };
    document.getElementById('shopBackBtn').onclick = () => { document.getElementById('shopOverlay').classList.add('hidden'); document.getElementById('menuOverlay').classList.remove('hidden'); updateDebtUI(); };
    document.getElementById('resultsMenuBtn').onclick = () => { document.getElementById('resultsOverlay').classList.add('hidden'); document.getElementById('menuOverlay').classList.remove('hidden'); updateDebtUI(); };
    document.getElementById('menuBtnGame').onclick = () => { 
        state.raceActive = false; 
        if (engineOsc) { engineOsc.stop(); engineOsc = null; }
        document.getElementById('hud').style.display = 'none'; 
        document.getElementById('debtBar').style.display = 'none'; 
        document.getElementById('speedo').style.display = 'none'; 
        document.getElementById('menuBtnGame').style.display = 'none'; 
        document.getElementById('joystick').style.display = 'none';
        document.getElementById('menuOverlay').classList.remove('hidden'); 
        updateDebtUI(); 
    };

    // Магазин
    function buyPart(k, cost) { if (state.coins >= cost) { state.coins -= cost; state.parts[k] = true; updateCoinsUI(); } else alert('Мало монет!'); }
    document.getElementById('buySpoiler').onclick = () => buyPart('spoiler', 50);
    document.getElementById('buyNeon').onclick = () => buyPart('neon', 100);
    document.getElementById('buyGold').onclick = () => buyPart('gold', 150);
    document.getElementById('buyWings').onclick = () => buyPart('wings', 200);
    document.getElementById('buyAntenna').onclick = () => buyPart('antenna', 80);
    document.getElementById('buyTint').onclick = () => buyPart('tint', 120);
    document.getElementById('buyRainbow').onclick = () => buyPart('rainbow', 90);
    document.getElementById('buyPolice').onclick = () => buyPart('police', 140);
    document.getElementById('buyHorns').onclick = () => buyPart('horns', 110);
    document.getElementById('buyBubble').onclick = () => buyPart('bubble', 160);

    animate();
};

function updateCoinsUI() {
    document.getElementById('shopCoinsDisplay').textContent = '💰 ' + state.coins;
    const map = { spoiler: 'Spoiler', neon: 'Neon', gold: 'Gold', wings: 'Wings', antenna: 'Antenna', tint: 'Tint', rainbow: 'Rainbow', police: 'Police', horns: 'Horns', bubble: 'Bubble' };
    for (let k in map) {
        let btn = document.getElementById('buy' + map[k]);
        if (state.parts[k] && btn) { btn.textContent = 'Куплено'; btn.disabled = true; }
    }
}

function updateDebtUI() {
    let percent = 100 - (state.debt / 10000 * 100);
    document.getElementById('debtFill').style.width = percent + '%';
    document.getElementById('debtText').textContent = 'Долг: ' + state.debt + ' 💰';
    if (state.gameBeaten) {
        document.getElementById('coinsDisplay').textContent = 'Долг 0! У вас: ' + state.coins + ' 💰';
        document.getElementById('debtBar').style.borderColor = '#44ff88'; 
        document.getElementById('debtFill').style.background = '#44ff88';
    } else {
        document.getElementById('coinsDisplay').textContent = 'Долг: ' + state.debt + ' 💰';
    }
}

function renderShop() {
    updateCoinsUI();
    const colors = [0xff3333, 0x33ff66, 0x3366ff, 0xffcc00, 0xff00ff, 0xffffff];
    const cp = document.getElementById('colorPicker'); 
    cp.innerHTML = '';
    colors.forEach(c => {
        const btn = document.createElement('button');
        btn.style.backgroundColor = '#' + c.toString(16).padStart(6, '0'); 
        btn.style.width = '40px'; btn.style.height = '40px'; btn.style.borderRadius = '50%'; btn.style.padding = '0'; btn.style.border = 'none';
        btn.onclick = () => { 
            if (state.coins >= 20) { state.coins -= 20; state.carColor = c; updateCoinsUI(); } 
            else alert('Мало монет!'); 
        };
        cp.appendChild(btn);
    });
}

function createTrackPath(type) {
    const points = [];
    for (let i = 0; i < 64; i++) {
        const a = (i / 64) * Math.PI * 2; let x, z;
        if (type === 'track') { x = Math.cos(a) * 50; z = Math.sin(a) * 50; }
        else if (type === 'desert') { const r = 50, p = 4; x = r * Math.sign(Math.cos(a)) * Math.pow(Math.abs(Math.cos(a)), 2/p); z = r * Math.sign(Math.sin(a)) * Math.pow(Math.abs(Math.sin(a)), 2/p); }
        else if (type === 'snow') { x = 60 * Math.sin(a) * Math.cos(a); z = 60 * Math.sin(a); }
        else if (type === 'city') { x = Math.cos(a) * 60; z = Math.sin(a) * 40; }
        else if (type === 'lava') { x = Math.cos(a) * 55 + Math.cos(a*3)*10; z = Math.sin(a) * 55 + Math.sin(a*3)*10; }
        else if (type === 'space') { x = Math.cos(a) * 70; z = Math.sin(a) * 70; }
        points.push(new THREE.Vector3(x, 0, z));
    }
    return points;
}

function loadLocation(type) {
    trackObjects.forEach(o => scene.remove(o)); 
    trackObjects = []; 
    cps = [];
    
    let trackColor = 0x333333;

    if (type === 'track') {
        scene.background = new THREE.Color(0x87CEEB); 
        scene.fog = new THREE.Fog(0x87CEEB, 50, 180);
        const g = new THREE.Mesh(new THREE.PlaneGeometry(500, 500), new THREE.MeshStandardMaterial({ color: 0x2a5a2a })); 
        g.rotation.x = -Math.PI/2; g.receiveShadow = true; scene.add(g); trackObjects.push(g);
        for (let i = 0; i < 60; i++) {
            const tree = new THREE.Group();
            const t1 = new THREE.Mesh(new THREE.CylinderGeometry(0.5, 0.7, 3, 6), new THREE.MeshStandardMaterial({ color: 0x4a3018 })); 
            t1.position.y = 1.5; t1.castShadow = true; tree.add(t1);
            const t2 = new THREE.Mesh(new THREE.DodecahedronGeometry(3), new THREE.MeshStandardMaterial({ color: 0x1a6a2a })); 
            t2.position.y = 4.5; t2.castShadow = true; tree.add(t2);
            tree.position.set(Math.cos(Math.random()*Math.PI*2)*(80+Math.random()*100), 0, Math.sin(Math.random()*Math.PI*2)*(80+Math.random()*100));
            scene.add(tree); trackObjects.push(tree);
        }
    } 
    else if (type === 'desert') {
        scene.background = new THREE.Color(0xdcb87e); 
        scene.fog = new THREE.Fog(0xdcb87e, 50, 180);
        const g = new THREE.Mesh(new THREE.PlaneGeometry(500, 500), new THREE.MeshStandardMaterial({ color: 0xc2a06d })); 
        g.rotation.x = -Math.PI/2; g.receiveShadow = true; scene.add(g); trackObjects.push(g); 
        trackColor = 0x8b7355;
        for (let i = 0; i < 20; i++) {
            const m = new THREE.Mesh(new THREE.ConeGeometry(20+Math.random()*30, 40+Math.random()*40, 4), new THREE.MeshStandardMaterial({ color: 0x9b7a54 }));
            m.position.set(Math.cos(Math.random()*Math.PI*2)*(140+Math.random()*80), 15, Math.sin(Math.random()*Math.PI*2)*(140+Math.random()*80));
            m.rotation.y = Math.random(); m.castShadow = true; scene.add(m); trackObjects.push(m);
        }
    } 
    else if (type === 'snow') {
        scene.background = new THREE.Color(0xaaccff); 
        scene.fog = new THREE.Fog(0xaaccff, 40, 150);
        const g = new THREE.Mesh(new THREE.PlaneGeometry(500, 500), new THREE.MeshStandardMaterial({ color: 0xffffff })); 
        g.rotation.x = -Math.PI/2; g.receiveShadow = true; scene.add(g); trackObjects.push(g); 
        trackColor = 0x1a3b5c; 
        for (let i = 0; i < 50; i++) {
            const t = new THREE.Group();
            const t1 = new THREE.Mesh(new THREE.ConeGeometry(3, 5, 8), new THREE.MeshStandardMaterial({ color: 0x1a4a2a })); 
            t1.position.y = 3; t1.castShadow = true; t.add(t1);
            const t2 = new THREE.Mesh(new THREE.ConeGeometry(2, 4, 8), new THREE.MeshStandardMaterial({ color: 0x1a4a2a })); 
            t2.position.y = 5.5; t2.castShadow = true; t.add(t2);
            t.position.set(Math.cos(Math.random()*Math.PI*2)*(80+Math.random()*100), 0, Math.sin(Math.random()*Math.PI*2)*(80+Math.random()*100));
            scene.add(t); trackObjects.push(t);
        }
    } 
    else if (type === 'city') {
        scene.background = new THREE.Color(0x111122); 
        scene.fog = new THREE.Fog(0x111122, 40, 150);
        const g = new THREE.Mesh(new THREE.PlaneGeometry(500, 500), new THREE.MeshStandardMaterial({ color: 0x222233 })); 
        g.rotation.x = -Math.PI/2; g.receiveShadow = true; scene.add(g); trackObjects.push(g); 
        trackColor = 0x2a2a3a;
        for (let i = 0; i < 40; i++) {
            const h = 20 + Math.random() * 60;
            const b = new THREE.Mesh(new THREE.BoxGeometry(12, h, 12), new THREE.MeshStandardMaterial({ color: 0x151520 }));
            b.position.set(Math.cos(Math.random()*Math.PI*2)*(90+Math.random()*100), h/2, Math.sin(Math.random()*Math.PI*2)*(90+Math.random()*100));
            b.castShadow = true; scene.add(b); trackObjects.push(b);
            const winMat = new THREE.MeshBasicMaterial({ color: Math.random() > 0.5 ? 0xffdd44 : 0x44ddff });
            for (let j = 0; j < 8; j++) { 
                const win = new THREE.Mesh(new THREE.BoxGeometry(2, 2, 0.5), winMat); 
                win.position.set((Math.random()-0.5)*8, (Math.random()-0.5)*h*0.8, 6); b.add(win); 
            }
        }
    }
    else if (type === 'lava') {
        scene.background = new THREE.Color(0x330000); 
        scene.fog = new THREE.Fog(0x550000, 30, 120);
        const g = new THREE.Mesh(new THREE.PlaneGeometry(500, 500), new THREE.MeshStandardMaterial({ color: 0x1a0000 })); 
        g.rotation.x = -Math.PI/2; g.receiveShadow = true; scene.add(g); trackObjects.push(g); 
        trackColor = 0x442211;
        for (let i = 0; i < 40; i++) {
            const rock = new THREE.Mesh(new THREE.DodecahedronGeometry(5 + Math.random()*10), new THREE.MeshStandardMaterial({ color: 0x110000 }));
            rock.position.set(Math.cos(Math.random()*Math.PI*2)*(80+Math.random()*100), Math.random()*5, Math.sin(Math.random()*Math.PI*2)*(80+Math.random()*100));
            rock.castShadow = true; scene.add(rock); trackObjects.push(rock);
            const fire = new THREE.PointLight(0xff3300, 2, 20);
            fire.position.copy(rock.position); fire.position.y += 3; scene.add(fire); trackObjects.push(fire);
        }
    }
    else if (type === 'space') {
        scene.background = new THREE.Color(0x000000); 
        scene.fog = new THREE.Fog(0x000000, 50, 200);
        const g = new THREE.Mesh(new THREE.PlaneGeometry(500, 500), new THREE.MeshStandardMaterial({ color: 0x050510 })); 
        g.rotation.x = -Math.PI/2; g.receiveShadow = true; scene.add(g); trackObjects.push(g); 
        trackColor = 0x335599;
        for (let i = 0; i < 100; i++) {
            const star = new THREE.Mesh(new THREE.SphereGeometry(0.5, 4, 4), new THREE.MeshBasicMaterial({ color: 0xffffff }));
            star.position.set((Math.random()-0.5)*400, Math.random()*50, (Math.random()-0.5)*400);
            scene.add(star); trackObjects.push(star);
        }
    }

    const curve = new THREE.CatmullRomCurve3(createTrackPath(type), true);
    const vertices = [], indices = [];
    for (let i = 0; i <= 150; i++) {
        const pt = curve.getPointAt(i/150), tan = curve.getTangentAt(i/150);
        const norm = new THREE.Vector3(-tan.z, 0, tan.x).normalize();
        const l = pt.clone().addScaledVector(norm, 8), r = pt.clone().addScaledVector(norm, -8);
        vertices.push(l.x, 0.1, l.z, r.x, 0.1, r.z);
        if (i < 150) { const a = i*2, b = i*2+1, c = (i+1)*2, d = (i+1)*2+1; indices.push(a, b, c, b, d, c); }
    }
    const geo = new THREE.BufferGeometry();
    geo.setAttribute('position', new THREE.Float32BufferAttribute(vertices, 3)); 
    geo.setIndex(indices); 
    geo.computeVertexNormals();
    const road = new THREE.Mesh(geo, new THREE.MeshStandardMaterial({ color: trackColor, side: THREE.DoubleSide }));
    road.receiveShadow = true; scene.add(road); trackObjects.push(road);

    for (let i = 0; i < 80; i++) {
        const pt = curve.getPointAt(i/80), tan = curve.getTangentAt(i/80);
        const line = new THREE.Mesh(new THREE.PlaneGeometry(0.5, 4), new THREE.MeshBasicMaterial({ color: 0xffffff, opacity: 0.6, transparent: true }));
        line.rotation.x = -Math.PI/2; 
        line.rotation.z = -Math.atan2(tan.x, tan.z);
        line.position.set(pt.x, 0.15, pt.z); 
        scene.add(line); trackObjects.push(line);
    }

    for (let i = 0; i < 8; i++) {
        const pt = curve.getPointAt(i/8); 
        cps.push({ x: pt.x, z: pt.z });
        const cp = new THREE.Mesh(new THREE.TorusGeometry(10, 0.5, 8, 32), new THREE.MeshBasicMaterial({ color: 0xffcc00 }));
        cp.rotation.x = Math.PI/2; 
        cp.position.set(pt.x, 0.5, pt.z); 
        scene.add(cp); trackObjects.push(cp);
    }
}
function createCar(color, parts) {
    const group = new THREE.Group();
    const body = new THREE.Mesh(new THREE.BoxGeometry(2.5, 0.6, 5), new THREE.MeshStandardMaterial({ color: color, metalness: 0.6, roughness: 0.3 }));
    body.position.y = 0.7; body.castShadow = true; group.add(body);
    
    let cabinMat = new THREE.MeshStandardMaterial({ color: parts.tint ? 0x000000 : 0x111111, metalness: 0.9 });
    const cabin = new THREE.Mesh(new THREE.BoxGeometry(2, 0.5, 2.2), cabinMat);
    cabin.position.set(0, 1.25, -0.2); cabin.castShadow = true; group.add(cabin);

    const wheelGeo = new THREE.CylinderGeometry(0.4, 0.4, 0.3, 16);
    const wheelMat = new THREE.MeshStandardMaterial({ color: parts.gold ? 0xffcc00 : 0x0a0a0a });
    [[-1.2, 0.4, 1.5], [1.2, 0.4, 1.5], [-1.2, 0.4, -1.5], [1.2, 0.4, -1.5]].forEach(pos => {
        const w = new THREE.Mesh(wheelGeo, wheelMat); w.rotation.z = Math.PI / 2; w.position.set(pos[0], pos[1], pos[2]); group.add(w);
    });

    const headlightMat = new THREE.MeshBasicMaterial({ color: 0xffffff }), tlMat = new THREE.MeshBasicMaterial({ color: 0xff0000 });
    [[-0.8, 2.5], [0.8, 2.5]].forEach(p => { const h = new THREE.Mesh(new THREE.BoxGeometry(0.4, 0.1, 0.1), headlightMat); h.position.set(p[0], 0.8, p[1]); group.add(h); });
    [[-0.8, -2.5], [0.8, -2.5]].forEach(p => { const t = new THREE.Mesh(new THREE.BoxGeometry(0.4, 0.1, 0.1), tlMat); t.position.set(p[0], 0.8, p[1]); group.add(t); });

    if (parts.spoiler) { const sp = new THREE.Mesh(new THREE.BoxGeometry(2.2, 0.1, 0.6), new THREE.MeshStandardMaterial({ color: 0x222222 })); sp.position.set(0, 1.4, -2.2); group.add(sp); }
    if (parts.wings) {
        const wL = new THREE.Mesh(new THREE.BoxGeometry(1, 0.1, 2), new THREE.MeshStandardMaterial({ color: 0xffcc00 }));
        wL.position.set(-1.8, 1, -1); wL.rotation.z = -0.3; group.add(wL);
        const wR = new THREE.Mesh(new THREE.BoxGeometry(1, 0.1, 2), new THREE.MeshStandardMaterial({ color: 0xffcc00 }));
        wR.position.set(1.8, 1, -1); wR.rotation.z = 0.3; group.add(wR);
    }
    if (parts.antenna) {
        const ant = new THREE.Mesh(new THREE.CylinderGeometry(0.05, 0.05, 2, 8), new THREE.MeshStandardMaterial({ color: 0xffffff })); ant.position.set(0, 2, -1.5); group.add(ant);
        const ball = new THREE.Mesh(new THREE.SphereGeometry(0.15, 8, 8), new THREE.MeshStandardMaterial({ color: 0xff0000 })); ball.position.set(0, 3, -1.5); group.add(ball);
    }
    if (parts.horns) {
        const hL = new THREE.Mesh(new THREE.ConeGeometry(0.2, 1, 8), new THREE.MeshStandardMaterial({ color: 0xffffff })); hL.position.set(-0.6, 0.8, 2.6); hL.rotation.x = Math.PI / 2; group.add(hL);
        const hR = new THREE.Mesh(new THREE.ConeGeometry(0.2, 1, 8), new THREE.MeshStandardMaterial({ color: 0xffffff })); hR.position.set(0.6, 0.8, 2.6); hR.rotation.x = Math.PI / 2; group.add(hR);
    }
    if (parts.bubble) {
        const bub = new THREE.Mesh(new THREE.SphereGeometry(1.8, 16, 16), new THREE.MeshStandardMaterial({ color: 0x88ccff, transparent: true, opacity: 0.3 })); bub.position.y = 1.2; group.add(bub);
    }

    let light = null;
    if (parts.neon) {
        const n = new THREE.Mesh(new THREE.BoxGeometry(2.6, 0.05, 5.1), new THREE.MeshBasicMaterial({ color: 0xff00ff })); n.position.y = 0.3; group.add(n);
        light = new THREE.PointLight(0xff00ff, 2, 20); light.position.set(0, 0.5, 0); group.add(light);
    }
    let policeLight = null;
    if (parts.police) {
        policeLight = new THREE.Mesh(new THREE.BoxGeometry(0.8, 0.2, 0.4), new THREE.MeshBasicMaterial({ color: 0xff0000 })); policeLight.position.set(0, 1.6, -0.2); group.add(policeLight);
    }
    return { group, light, policeLight };
}

function startEngine() {
    if (engineOsc) return;
    if (audioCtx.state === 'suspended') audioCtx.resume();
    engineOsc = audioCtx.createOscillator(); engineGain = audioCtx.createGain();
    engineOsc.type = 'sawtooth'; engineOsc.frequency.setValueAtTime(50, audioCtx.currentTime);
    engineGain.gain.setValueAtTime(0.02, audioCtx.currentTime);
    engineOsc.connect(engineGain); engineGain.connect(audioCtx.destination); engineOsc.start();
}

function updateEngine(speed) {
    if (engineOsc) engineOsc.frequency.setTargetAtTime(50 + (Math.abs(speed) * 4), audioCtx.currentTime, 0.1);
}

function stopEngine() {
    if (engineOsc) { engineOsc.stop(); engineOsc.disconnect(); engineGain.disconnect(); engineOsc = null; }
}

window.startRace = function(location) {
    state.raceActive = true; 
    startEngine(); 
    loadLocation(location);

    if (player.mesh) scene.remove(player.mesh); 
    if (bot.mesh) scene.remove(bot.mesh);
    
    const startPt = cps[0], nextPt = cps[1], startAngle = Math.atan2(nextPt.x - startPt.x, nextPt.z - startPt.z);
    const pData = createCar(state.carColor, state.parts);
    
    player = { mesh: pData.group, neonLight: pData.light, policeLight: pData.policeLight, angle: startAngle, speed: 0, lap: 1, nextCp: 0 };
    player.mesh.position.set(startPt.x, 0, startPt.z); 
    player.mesh.rotation.y = startAngle; 
    scene.add(player.mesh);

    bot = { mesh: createCar(0x3366ff, {}).group, angle: startAngle, nextCp: 0 };
    bot.mesh.position.set(startPt.x + 6, 0, startPt.z); 
    bot.mesh.rotation.y = startAngle; 
    scene.add(bot.mesh);

    camera.position.set(startPt.x - Math.sin(startAngle)*18, 10, startPt.z - Math.cos(startAngle)*18);

    document.getElementById('menuOverlay').classList.add('hidden'); 
    document.getElementById('resultsOverlay').classList.add('hidden');
    document.getElementById('hud').style.display = 'block'; 
    document.getElementById('debtBar').style.display = 'block'; 
    document.getElementById('speedo').style.display = 'block';
    document.getElementById('menuBtnGame').style.display = 'flex'; 
    document.getElementById('joystick').style.display = 'block'; 
    document.getElementById('lapDisplay').textContent = '1/3'; 
    updateDebtUI();
};

function endRace() {
    state.raceActive = false; stopEngine();
    state.coins += 100; state.debt = Math.max(0, state.debt - 100);
    updateCoinsUI(); updateDebtUI();
    
    document.getElementById('resultsBody').innerHTML = '<div>🥇 1. Вы</div><div>🥈 2. Бот</div>';
    document.getElementById('rewardDisplay').textContent = 'Награда: +100 💰';
    document.getElementById('hud').style.display = 'none'; 
    document.getElementById('debtBar').style.display = 'none'; 
    document.getElementById('speedo').style.display = 'none'; 
    document.getElementById('menuBtnGame').style.display = 'none';
    document.getElementById('joystick').style.display = 'none';
    document.getElementById('resultsOverlay').classList.remove('hidden');

    if (state.debt === 0 && !state.gameBeaten) {
        state.gameBeaten = true; 
        document.getElementById('resultsTitle').textContent = "ПОБЕДА!";
        document.getElementById('resultsBody').innerHTML = '<div style="color:#ffcc00;">Вы выплатили долг!</div>';
        document.getElementById('resultsMenuBtn').textContent = "ПРОДОЛЖИТЬ ИГРАТЬ";
    } else {
        document.getElementById('resultsTitle').textContent = "ФИНИШ"; 
        document.getElementById('resultsMenuBtn').textContent = "В меню";
    }
}
// ==========================================
// ЧАСТИЦЫ (ДЫМ / ПЫЛЬ)
// ==========================================
function createDust(x, z, color) {
    const geo = new THREE.SphereGeometry(Math.random() * 0.4 + 0.1, 4, 4);
    const mat = new THREE.MeshBasicMaterial({ color: color, transparent: true, opacity: 0.6 });
    const mesh = new THREE.Mesh(geo, mat);
    mesh.position.set(x, 0.2, z);
    scene.add(mesh);
    dustParticles.push({ mesh, life: 1, vx: (Math.random() - 0.5) * 4, vz: (Math.random() - 0.5) * 4 });
}

function updateDust(dt) {
    for (let i = dustParticles.length - 1; i >= 0; i--) {
        let p = dustParticles[i];
        p.life -= dt * 2;
        p.mesh.position.x += p.vx * dt;
        p.mesh.position.z += p.vz * dt;
        p.mesh.material.opacity = p.life;
        if (p.life <= 0) {
            scene.remove(p.mesh);
            dustParticles.splice(i, 1);
        }
    }
}

// ==========================================
// УПРАВЛЕНИЕ (КЛАВИАТУРА)
// ==========================================
window.addEventListener('keydown', e => {
    let k = e.key.toLowerCase();
    if (['w', 'a', 's', 'd', 'arrowup', 'arrowdown', 'arrowleft', 'arrowright'].includes(k)) {
        keys[k] = true; e.preventDefault();
    }
});
window.addEventListener('keyup', e => {
    let k = e.key.toLowerCase();
    if (['w', 'a', 's', 'd', 'arrowup', 'arrowdown', 'arrowleft', 'arrowright'].includes(k)) {
        keys[k] = false;
    }
});

document.body.addEventListener('click', () => { 
    window.focus(); 
    if (audioCtx && audioCtx.state === 'suspended') audioCtx.resume(); 
});

// ==========================================
// ИГРОВОЙ ЦИКЛ
// ==========================================
const clock = new THREE.Clock();

function animate() {
    requestAnimationFrame(animate);
    let dt = Math.min(clock.getDelta(), 0.1);

    if (state.raceActive) {
        let th = 0, st = 0;
        
        // Клавиатура
        if (keys['w'] || keys['arrowup']) th += 1;
        if (keys['s'] || keys['arrowdown']) th -= 1;
        if (keys['a'] || keys['arrowleft']) st -= 1;
        if (keys['d'] || keys['arrowright']) st += 1;

        // Джойстик
        if (joystick.active) {
            th -= joystick.y;
            st += joystick.x;
        }

        const maxSpeed = 45, accel = 30;
        if (th > 0.1) player.speed = Math.min(player.speed + accel * dt, maxSpeed);
        else if (th < -0.1) player.speed = Math.max(player.speed - accel * dt, -maxSpeed / 2);
        else { player.speed *= 0.96; if (Math.abs(player.speed) < 0.1) player.speed = 0; }

        if (Math.abs(player.speed) > 0.1) {
            player.angle -= st * 2.5 * dt * Math.sign(player.speed);
            player.mesh.position.x += Math.sin(player.angle) * player.speed * dt;
            player.mesh.position.z += Math.cos(player.angle) * player.speed * dt;

            // Дым из-под колес
            if (Math.abs(player.speed) > 15 && Math.random() > 0.4) {
                let dustColor = 0x888888;
                if (state.parts.rainbow) {
                    dustColor = new THREE.Color().setHSL(Date.now() * 0.001 % 1, 1, 0.5).getHex();
                }
                createDust(player.mesh.position.x, player.mesh.position.z, dustColor);
            }
        }
        player.mesh.rotation.y = player.angle;

        updateEngine(player.speed);

        // Мигалка
        if (player.policeLight) {
            const time = Date.now() * 0.01;
            player.policeLight.material.color.setHex(Math.sin(time) > 0 ? 0xff0000 : 0x0000ff);
        }

        // Проверка кругов
        let tCp = cps[player.nextCp % cps.length];
        if ((tCp.x - player.mesh.position.x)**2 + (tCp.z - player.mesh.position.z)**2 < 150) {
            player.nextCp++;
            if (player.nextCp % cps.length === 0) {
                player.lap++;
                if (player.lap > 3) endRace();
                else document.getElementById('lapDisplay').textContent = player.lap + '/3';
            }
        }

        // Бот
        let bCp = cps[bot.nextCp % cps.length];
        let bdx = bCp.x - bot.mesh.position.x, bdz = bCp.z - bot.mesh.position.z;
        let bAngle = Math.atan2(bdx, bdz), bdiff = bAngle - bot.angle;
        while (bdiff > Math.PI) bdiff -= Math.PI * 2;
        while (bdiff < -Math.PI) bdiff += Math.PI * 2;
        bot.angle += Math.max(-2 * dt, Math.min(2 * dt, bdiff));
        bot.mesh.position.x += Math.sin(bot.angle) * 25 * dt;
        bot.mesh.position.z += Math.cos(bot.angle) * 25 * dt;
        bot.mesh.rotation.y = bot.angle;
        if (bdx*bdx + bdz*bdz < 150) bot.nextCp++;

        // Спидометр
        document.getElementById('speedo').innerHTML = Math.floor(Math.abs(player.speed) * 3.6) + ' <div style="font-size:12px;color:#aaa;">км/ч</div>';

        // Камера
        let camX = player.mesh.position.x - Math.sin(player.angle) * 20;
        let camZ = player.mesh.position.z - Math.cos(player.angle) * 20;
        camera.position.x += (camX - camera.position.x) * 8 * dt;
        camera.position.z += (camZ - camera.position.z) * 8 * dt;
        camera.position.y += (10 - camera.position.y) * 8 * dt;
        camera.lookAt(player.mesh.position.x + Math.sin(player.angle)*10, 1, player.mesh.position.z + Math.cos(player.angle)*10);

        // Обновляем частицы
        updateDust(dt);
    }
    renderer.render(scene, camera);
}
</script>
